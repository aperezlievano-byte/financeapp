name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Copy env template
        run: cp .env.example .env

      - name: Start Postgres
        run: docker compose up -d --wait

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate dev database
        run: pnpm db:migrate

      - name: Seed dev database
        run: pnpm db:seed

      - name: Migrate test database
        run: pnpm db:migrate:test

      - name: Seed test database
        run: pnpm db:seed:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Smoke test
        run: pnpm smoke

      - name: Build fixtures
        run: pnpm fixtures

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Backup
        run: sh scripts/backup.sh

      - name: Restore check
        run: sh scripts/restore-check.sh

      - name: Checkpoint tag count
        run: test "$(git tag -l 'step-*' | wc -l | tr -d ' ')" -eq 14

  # No forma parte del gate: no puede tumbar el deploy (continue-on-error), y
  # su salida la revisa Alejandro a mano. Un hallazgo abre un issue, no
  # detiene una entrega (§14).
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod
